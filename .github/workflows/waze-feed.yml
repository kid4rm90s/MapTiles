name: Waze Feed Update
# version 1.0.8
on:
  schedule:
    # 30-min interval between 8:00 AM - 3:00 PM MYT (UTC+8)
    # 8:00 AM MYT = 00:00 UTC | 3:00 PM MYT = 07:00 UTC
    - cron: '*/30 0-6 * * *'
    # 60-min interval outside that window (3:00 PM - 8:00 AM MYT)
    # 3:00 PM MYT = 07:00 UTC | 8:00 AM MYT = 00:00 UTC
    - cron: '0 7-23 * * *'
  workflow_dispatch:

concurrency:
  group: waze-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
      
      - name: Run Waze Feed Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_WAZENEPAL: ${{ secrets.DISCORD_WEBHOOK_URL_WAZENEPAL }}
        run: |
          python waze_feed.py
          if [ $? -ne 0 ]; then
            echo "Script failed with exit code $?"
            exit 1
          fi
      
      - name: Commit state file if updated
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add last_update.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update last_update.txt [skip ci]"

            # Sync with latest remote to prevent non-fast-forward rejection
            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
            echo "State file committed and pushed."
          else
            echo "No change — state file already up to date."
          fi
