name: Waze Feed Update
# version 1.0.4
on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
      
      - name: Run Waze Feed Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python waze_feed.py
          if [ $? -ne 0 ]; then
            echo "Script failed with exit code $?"
            exit 1
          fi
      
      - name: Commit state file if updated
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add last_update.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update last_update.txt [skip ci]"
            git push
            echo "State file committed and pushed."
          else
            echo "No change — state file already up to date."
          fi
